<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Mon profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let item of items">
    <ion-card-content>
      <h2>Cher {{ item.nom }}</h2>
      <p>Votre profil est le suivant :</p>

      <img *ngIf="item.filename" [src]="server + item.filename" alt="photo" />

      <ion-row>
        <ion-col size="4">Téléphone</ion-col>
        <ion-col size="8">{{ item.telephone }}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="4">Email</ion-col>
        <ion-col size="8">{{ item.email }}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="4">Prénom</ion-col>
        <ion-col size="8">{{ item.prenom }}</ion-col>
      </ion-row>

      <ion-button fill="clear" size="small" (click)="editPatients(item)">Modifier</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-item *ngIf="!items.length" lines="none">
    <ion-label class="ion-text-wrap">Aucune information de profil disponible.</ion-label>
  </ion-item>
</ion-content>
