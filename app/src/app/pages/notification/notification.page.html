<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Rappels</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-text *ngIf="!isNative" color="medium">
    <p>Les rappels locaux s'activent dans l'application mobile (APK). Cet écran reste utilisable pour préparer un rappel.</p>
  </ion-text>

  <ion-list>
    <ion-item>
      <ion-input label="Titre" labelPlacement="floating" [(ngModel)]="titre" name="titre"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Message" labelPlacement="floating" [(ngModel)]="message" name="message"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label>Date & heure</ion-label>
      <ion-datetime-button datetime="when" slot="end"></ion-datetime-button>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="when" [(ngModel)]="when" name="when" presentation="date-time"></ion-datetime>
        </ng-template>
      </ion-modal>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <ion-button expand="block" (click)="schedule()">Programmer le rappel</ion-button>
  </div>
</ion-content>
