<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Administration</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item button (click)="go('/add-admin')"><ion-label>Nouvel administrateur</ion-label></ion-item>
    <ion-item button (click)="go('/ajout-ets')"><ion-label>Nouvel établissement</ion-label></ion-item>
    <ion-item button (click)="go('/logout')"><ion-label color="danger">Déconnexion</ion-label></ion-item>
  </ion-list>

  <ion-list>
    <ion-item *ngFor="let a of admins">
      <ion-label class="ion-text-wrap">
        <strong>{{ a.login }}</strong>
        <br /><small>{{ a.nom || '—' }} · {{ a.email || '—' }} · {{ a.telephone || '—' }}</small>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="!admins.length" lines="none"><ion-label>Aucun administrateur.</ion-label></ion-item>
  </ion-list>
</ion-content>
