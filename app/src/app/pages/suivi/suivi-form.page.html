<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button [defaultHref]="'/suivi/' + cfg.slug"></ion-back-button></ion-buttons>
    <ion-title>{{ isEdit ? 'Modifier' : 'Ajouter' }} — {{ cfg.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="save()">
    <ion-list>
      <ion-item *ngFor="let f of cfg.fields">
        <ion-textarea
          *ngIf="f.type === 'textarea'; else plain"
          [label]="f.label"
          labelPlacement="floating"
          [name]="f.key"
          [(ngModel)]="model[f.key]"
          autoGrow="true"
        ></ion-textarea>
        <ng-template #plain>
          <ion-input
            [label]="f.label"
            labelPlacement="floating"
            [type]="f.type || 'text'"
            [name]="f.key"
            [(ngModel)]="model[f.key]"
          ></ion-input>
        </ng-template>
      </ion-item>
    </ion-list>

    <div class="ion-padding">
      <ion-button expand="block" type="submit">{{ isEdit ? 'Mettre à jour' : 'Ajouter' }}</ion-button>
    </div>
  </form>
</ion-content>
