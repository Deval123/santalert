<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Mon profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let etablissement of etablissements">
    <ion-card-header>
      <ion-card-title>{{ etablissement.nom }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>Tél : {{ etablissement.telephone }}</ion-card-content>
  </ion-card>

  <ion-card *ngFor="let item of items">
    <ion-card-content>
      <h2>Bienvenue {{ item.nom }}</h2>
      <h3>Vos informations de profil :</h3>
      <ion-row>
        <ion-col size="4">Téléphone</ion-col>
        <ion-col size="8">{{ item.telephone }}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="4">Email</ion-col>
        <ion-col size="8">{{ item.email }}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="4">Matricule</ion-col>
        <ion-col size="8">{{ item.matricule }}</ion-col>
      </ion-row>
      <ion-button fill="clear" size="small" (click)="editPersonel(item)">Modifier</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-item *ngIf="!items.length && !etablissements.length" lines="none">
    <ion-label class="ion-text-wrap">Aucune information de profil disponible.</ion-label>
  </ion-item>

  <div class="ion-padding">
    <ion-button expand="block" fill="outline" (click)="goToHome()">Aller à l'accueil</ion-button>
  </div>
</ion-content>
