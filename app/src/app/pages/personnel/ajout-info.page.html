<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Patient : {{ patientName || '—' }}</ion-title>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-segment [value]="active" (ionChange)="switch($any($event).detail.value)">
      <ion-segment-button *ngFor="let a of actes" [value]="a.slug">
        <ion-label>{{ a.title }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Liste -->
  <ng-container *ngIf="!adding">
    <ion-list>
      <ion-item button *ngFor="let r of rows" (click)="openRow(r)" detail="true">
        <ion-label class="ion-text-wrap">
          <span *ngFor="let c of acte.columns">
            <small>{{ c.label }}:</small> {{ r[c.key] || '—' }} &nbsp;
          </span>
        </ion-label>
      </ion-item>
      <ion-item *ngIf="!rows.length" lines="none">
        <ion-label>Aucun enregistrement.</ion-label>
      </ion-item>
    </ion-list>
    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button (click)="adding = true"><ion-icon name="add"></ion-icon></ion-fab-button>
    </ion-fab>
  </ng-container>

  <!-- Ajout -->
  <form *ngIf="adding" (ngSubmit)="save()">
    <ion-button fill="clear" (click)="adding = false">
      <ion-icon slot="start" name="arrow-back-outline"></ion-icon> Retour
    </ion-button>
    <ion-list>
      <ion-item *ngFor="let f of acte.fields">
        <ion-textarea
          *ngIf="f.type === 'textarea'; else plain"
          [label]="f.label"
          labelPlacement="floating"
          [name]="f.key"
          [(ngModel)]="model[f.key]"
        ></ion-textarea>
        <ng-template #plain>
          <ion-input
            [label]="f.label"
            labelPlacement="floating"
            [type]="f.type || 'text'"
            [name]="f.key"
            [(ngModel)]="model[f.key]"
          ></ion-input>
        </ng-template>
      </ion-item>
    </ion-list>
    <div class="ion-padding">
      <ion-button expand="block" type="submit">Enregistrer</ion-button>
    </div>
  </form>
</ion-content>
