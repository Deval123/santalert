<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/gestion-patient"></ion-back-button></ion-buttons>
    <ion-title>Rechercher un patient</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-searchbar
    [(ngModel)]="term"
    placeholder="Nom ou prénom"
    (keyup.enter)="search()"
    (ionClear)="results = []"
  ></ion-searchbar>
  <ion-button expand="block" (click)="search()">Rechercher</ion-button>

  <ion-list>
    <ion-item button *ngFor="let p of results" (click)="select(p)">
      <ion-label class="ion-text-wrap">
        <strong>{{ p.nom }} {{ p.prenom }}</strong><br />
        <small>{{ p.email || '—' }} · {{ p.telephone || '—' }}</small>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="searched && !results.length" lines="none">
      <ion-label>Aucun patient avec ce nom.</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
