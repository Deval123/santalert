
<ion-content padding #pageContent fullscreen>
  <div *ngIf="etablissements">
  <div *ngFor="let etablissement of etablissements">
    <p>{{etablissement.nom}}</p>
    <h3>Tel: {{ etablissement.telephone }}</h3>
  </div>
</div>

  <ion-list no-line>

    <ion-item>
      <ion-input type="text" placeholder="Nature" name="nature" #nature></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Lieu" name="lieu" #lieu></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Date du jour</ion-label>

      <ion-input round type="datetime-local" placeholder="Date du jour" name="datedebut" #datedebut></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Date de réalisation</ion-label>
      <ion-input round type="datetime-local" placeholder="Date de réalisation" name="datefin" #datefin></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Patient" name="patient" #patient></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Observation" name="observation" #observation></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Tiers" name="tiers" #tiers></ion-input>
    </ion-item>

  </ion-list>

  <div padding>
    <button ion-button  round outline block (click)="Ajouter()">Ajouter</button>
  </div>
</ion-content>

<ion-footer [scrollHide]="footerScrollConfig" [scrollContent]="pageContent">
  <ion-toolbar>
    <ion-grid>
      <ion-row >
        <marquee>
          <ion-slides [slidesPerView]="4">
            <ion-slide>
              <img src="assets/imgs/slider/norvégienne.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/archi-doc1.jpg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/h2o.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/nomoov.jpeg" alt="">
            </ion-slide>
          </ion-slides>
          <h6>Insertions publicitaires disponibles au 697019629 / 673230997</h6>
        </marquee>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
