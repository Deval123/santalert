    <img src="{{userProfile.picture.data.url}}" >

  </ion-card>
  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->


<ion-content padding #pageContent fullscreen>
  <div *ngIf="etablissements">
    <div *ngFor="let etablissement of etablissements">
      <p>{{etablissement.nom}}</p>
      <h3>Tel: {{ etablissement.telephone }}</h3>
    </div>
  </div>
  <div class="aucun">
    <ion-item *ngFor="let item of items" >
      <h2>Welcome {{item.nom}}</h2>
      <h3>Your profile information is as follows:</h3>
      <ion-row>
        <ion-col col-4>
          Telephone
        </ion-col>
        <ion-col col-8>
          {{item.telephone}}
        </ion-col>

      </ion-row>
      <ion-row>
        <ion-col col-4>
          Email
        </ion-col>
        <ion-col col-8>
          {{item.email}}
        </ion-col>

      </ion-row>
      <ion-row>
        <ion-col col-4>
          matricule
        </ion-col>
        <ion-col col-8>
          {{item.matricule}}
        </ion-col>

      </ion-row>
      <ion-row>
        <a href="javascript:void(0)" (click)="editPersonel(item)" class="" data-toggle="tooltip" title="Edit" >
          <i class="fa fa-check"></i></a>
      </ion-row>
    </ion-item>
  </div>

  <div padding>
    <button ion-button  round outline block (click)="GoTo()">Go To Home</button>
  </div>

</ion-content>
<ion-footer [scrollHide]="footerScrollConfig" [scrollContent]="pageContent">
  <ion-toolbar>
    <ion-grid>
      <ion-row >
        <marquee>
          <ion-slides [slidesPerView]="4">
            <ion-slide>
              <img src="assets/imgs/slider/norvégienne.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/archi-doc1.jpg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/h2o.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/nomoov.jpeg" alt="">
            </ion-slide>
          </ion-slides>
          <h6>Insertions publicitaires disponibles au 697019629 / 673230997</h6>
        </marquee>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
