<ion-header>

  <ion-navbar>
    <ion-title>ajout-departement</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
  <ion-list no-line>

    <ion-item>
      <ion-input type="text" placeholder="nom" name="nom" #nom></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="description" name="description" #description></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Etablissement</ion-label>
      <ion-select selecDesktop [(ngModel)]="codeText" #code="ngModel" [compareWith]="compare">
        <ion-option *ngFor="let item of items" [value]="item">{{item.nom}}</ion-option>
      </ion-select>
    </ion-item>

  </ion-list>

  <div padding>
    <button ion-button  round outline block (click)="Ajouter()">Ajouter</button>
  </div>
</ion-content>
