<ion-header>

  <ion-navbar>
    <ion-title>Dashboard</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>

  <!-- List of Text Items -->
<ion-list>
  <ion-item-sliding *ngFor="let user of users;">
    <ion-item >
      <ion-avatar item="start">
          <img src="{{server + user.images}}" title="pict">
      </ion-avatar>
      <h2>{{user.user_name}}</h2>
      <h3>{{user.phone_number}}</h3>
      <p>{{user.gender}} - {{user.created_at}}</p>
    </ion-item>
    <ion-item-options slide="right">
        <button ion-button color="prmary" (click)="showData(user.user_id)">
          <ion-icon name="eye"></ion-icon>
          Show
        </button>
        <button ion-button color="secondary" (click)="updateData(user.user_id, user.user_name, user.phone_number, user.gender)">
          <ion-icon name="brush"></ion-icon>
          Update
        </button>
        <button ion-button color="danger" (click)="deleteData(user.user_id)">
          <ion-icon name="trash"></ion-icon>
          Delete
        </button>
      </ion-item-options>
</ion-item-sliding>
</ion-list>
  <ion-fab right bottom>
    <button ion-fab mini color="danger" (click)="formadd()"><ion-icon name="add"></ion-icon></button>
  </ion-fab>
</ion-content>
