<ion-header [scrollHide]="headerScrollConfig" [scrollContent]="pageContent">

<ion-navbar>
    <ion-title>edit-maladie-chronique</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding #pageContent fullscreen>
  <ion-list no-line >

    <ion-item>
      <ion-label floating>Nom de la maladie</ion-label>
      <ion-input id="newnom"  type="text" name= "newnom" #newnom [(ngModel)]="nom"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Medecin Traitant</ion-label>
      <ion-input id="newmedecin_traitant" type="text" name= "newmedecin_traitant" #newmedecin_traitant [(ngModel)]="medecin_traitant"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Restriction</ion-label>
      <ion-input id="newrestriction" type="text" name= "newrestriction" #newrestriction [(ngModel)]="restriction"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Recommandation</ion-label>
      <ion-input id="newrecommandation" type="text" name= "newrecommandation" #newrecommandation [(ngModel)]="recommandation"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Commentaire</ion-label>
      <ion-input id="newcommentaire" type="text" name= "newcommentaire" #newcommentaire [(ngModel)]="commentaire"></ion-input>
    </ion-item>
    <div >
      <button ion-button  round outline block (click)="Edit()">Update
        <ion-icon name="create"></ion-icon>
      </button>
    </div>
  </ion-list>

</ion-content>
<ion-footer [scrollHide]="footerScrollConfig" [scrollContent]="pageContent">
  <ion-toolbar>
    <ion-grid>
      <ion-row >
        <marquee>
          <ion-slides [slidesPerView]="4">
            <ion-slide>
              <img src="assets/imgs/slider/norvégienne.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/archi-doc1.jpg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/h2o.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/nomoov.jpeg" alt="">
            </ion-slide>
          </ion-slides>
          <h6>Insertions publicitaires disponibles au 697019629 / 673230997</h6>
        </marquee>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
