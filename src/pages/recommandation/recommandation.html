
<ion-header [scrollHide]="headerScrollConfig" [scrollContent]="pageContent">

  <ion-navbar>
    <ion-title>recommandation</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding #pageContent fullscreen>
    <div id="menuTopContainer" >
      <ul id="menuTop">
        <div id="content">
          <div>
            <div class="classicContent">
                <h2><img class="pres"  src="assets/imgs/Santlogo.png" /></h2>
                    <ion-list>
                      <div *ngFor="let item of items">
                          <h2>{{item.categorie}}</h2>
                          <div>
                              <p >{{item.contenu}}</p>
                          </div>
                      </div>
                    </ion-list>
            </div>

          </div>
        </div>
      </ul>
    </div>
</ion-content>
<ion-footer [scrollHide]="footerScrollConfig" [scrollContent]="pageContent">
  <ion-toolbar>
    <ion-grid>
      <ion-row >
        <marquee>
          <ion-slides [slidesPerView]="4">
            <ion-slide>
              <img src="assets/imgs/slider/norvégienne.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/archi-doc1.jpg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/h2o.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/nomoov.jpeg" alt="">
            </ion-slide>
          </ion-slides>
          <h6>Insertions publicitaires disponibles au 697019629 / 673230997</h6>
        </marquee>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
