<ion-header>

  <ion-navbar>
    <ion-title>ajout-ets</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
  <ion-list no-line>

    <ion-item>
      <ion-label>Statut</ion-label>
      <ion-select [(ngModel)]="statutText" name="statut" #statut>
        <ion-option value="Public">Public</ion-option>
        <ion-option value="Privé">Privé</ion-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label>Type</ion-label>
      <ion-select [(ngModel)]="typeText" name="type" #type (ionChange)="onChange($event)">
        <ion-option value="officine">Officine</ion-option>
        <ion-option value="formation_sanitaire"> Formation Sanitaire</ion-option>
        <ion-option value="Laboratoire">Laboratoire</ion-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="nom" name="nom" #nom></ion-input>
    </ion-item>

    <ion-item>
      <ion-input  type="text" placeholder="ville" name="ville" #ville></ion-input>
    </ion-item>

    <ion-item>
      <ion-input  type="text" placeholder="telephone" name="telephone" #telephone></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="email" name="email" #email></ion-input>
    </ion-item>

    <ion-item>
      <ion-input  type="text" placeholder="adresse" name="adresse" #adresse></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="code" name="code" #code></ion-input>
    </ion-item>

  </ion-list>

  <div padding>
    <button ion-button  round outline block (click)="Register()">Ajouter</button>
  </div>
</ion-content>
