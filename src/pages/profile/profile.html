<ion-header [scrollHide]="headerScrollConfig" [scrollContent]="pageContent">
  <ion-navbar>
    <button ion-button menuToggle>
      <ion-icon name="menu"></ion-icon>
    </button>
    <ion-title>profile</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding #pageContent fullscreen>
  <ion-item *ngFor="let item of items" >

    <ion-item>
      <div class="images" class="col-md-12">
        <h2>Cher {{item.nom}}</h2>
        <p>Votre profile est le suivant:</p>
        <div class="one-image" class="col-md-6">
          <img src="{{server + item.filename}}">
        </div>

        <div  class="col-md-6 aucun">

          <ion-row>
            <ion-col col-4>
              Telephone
            </ion-col>
            <ion-col col-8>
              {{item.telephone}}
            </ion-col>
          </ion-row>

          <ion-row>
            <ion-col col-4>
              Email
            </ion-col>
            <ion-col col-8>
              {{item.email}}
            </ion-col>
          </ion-row>

          <ion-row>
            <ion-col col-4>
              Prenom
            </ion-col>
            <ion-col col-8>
              {{item.prenom}}
            </ion-col>
          </ion-row>

          <ion-row>
            <a href="javascript:void(0)" (click)="editPatients(item)" class="" data-toggle="tooltip" title="Edit" >
              <i class="fa fa-check"></i></a>
          </ion-row>
        </div>
      </div>

    </ion-item>



  </ion-item>

  <ion-card *ngIf="userProfile">
    <img src="{{userProfile.picture.data.url}}" >
    <p>{{userProfile.name}}</p>
  </ion-card>
</ion-content>

<ion-footer [scrollHide]="footerScrollConfig" [scrollContent]="pageContent">
  <ion-toolbar>
    <ion-grid>
      <ion-row >
        <marquee>
          <ion-slides [slidesPerView]="4">
            <ion-slide>
              <img src="assets/imgs/slider/norvégienne.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/archi-doc1.jpg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/h2o.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/nomoov.jpeg" alt="">
            </ion-slide>
          </ion-slides>
          <h6>Insertions publicitaires disponibles au 697019629 / 673230997</h6>
        </marquee>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
