<ion-content padding #pageContent fullscreen>

    <ion-list no-line>

    <ion-item>
      <ion-label floating>Date du jour</ion-label>
      <ion-input round type="datetime-local"  placeholder="Date du  jour" name="fullname" #datecreate></ion-input>

    </ion-item>
    <ion-item>
      <ion-input type="text" placeholder="Symtome" name="fullname" #symtome></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Traitement" name="traitement" #traitement></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Evaluation" name="evaluation" #evaluation></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Observation" name="observation" #observation></ion-input>
    </ion-item>
    <ion-item>
      <ion-input type="text" placeholder="Cout traitement" name="cout_traitement" #cout_traitement></ion-input>
    </ion-item>

  </ion-list>

  <div padding>
    <button ion-button  round outline block (click)="Ajouter()">Ajouter</button>
  </div>

</ion-content>

<ion-footer [scrollHide]="footerScrollConfig" [scrollContent]="pageContent">
  <ion-toolbar>
    <ion-grid>
      <ion-row >
        <marquee>
          <ion-slides [slidesPerView]="4">
            <ion-slide>
              <img src="assets/imgs/slider/norvégienne.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/archi-doc1.jpg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/h2o.jpeg" alt="">
            </ion-slide>
            <ion-slide>
              <img src="assets/imgs/slider/nomoov.jpeg" alt="">
            </ion-slide>
          </ion-slides>
          <h6>Insertions publicitaires disponibles au 697019629 / 673230997</h6>
        </marquee>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
